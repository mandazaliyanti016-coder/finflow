<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinFlow - Semua Halaman</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f3f5f8; }
  header { background: #0f4c81; display: flex; align-items: center; gap: 4px; padding: 0 16px; flex-wrap: wrap; }
  header h1 { color: #fff; font-size: 20px; margin-right: 20px; padding: 14px 0; }
  button.tab { background: transparent; color: #cfe0f1; border: 0; padding: 18px 14px; font-size: 15px; cursor: pointer; border-bottom: 3px solid transparent; }
  button.tab:hover { color: #fff; }
  button.tab.active { color: #fff; border-bottom-color: #fff; font-weight: 600; }
  a.out { margin-left: auto; color: #fff; font-size: 14px; }
  main { flex: 1; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #fff; }
  iframe.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>FinFlow</h1>
  <span id="tabs"></span>
  <a class="out" href="/login" target="_blank">Login</a>
</header>
<main id="frames"></main>

<script>
const today = new Date().toISOString().slice(0, 10);
const pages = [
  ["Daftar Akun",        "/accounts"],
  ["Penjualan Tunai",    "/sales/create"],
  ["Input Biaya",        "/expenses/create"],
  ["Konsolidasi",        "/consolidation"],
  ["Rekonsiliasi Kas",   "/reconciliation"],
  ["Laporan Keuangan",   `/reports?from=2026-10-01&to=${today}`],
  ["Faktur QRIS",        "/invoices"]
];
const tabs = document.getElementById("tabs");
const frames = document.getElementById("frames");

pages.forEach(([name, url], i) => {
  const b = document.createElement("button");
  b.className = "tab"; b.textContent = name;
  const f = document.createElement("iframe");
  b.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll("iframe").forEach(x => x.classList.remove("show"));
    b.classList.add("active"); f.classList.add("show");
    if (!f.src) f.src = url;           // dimuat saat pertama kali dibuka
    location.hash = i;
  };
  tabs.appendChild(b); frames.appendChild(f);
});
const start = parseInt(location.hash.slice(1)) || 0;
tabs.children[start].click();
</script>
</body>
</html>
